plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ferrovias'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-ldap'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
	runtimeOnly 'org.flywaydb:flyway-sqlserver'
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers-mssqlserver'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Dos velocidades, a propósito.
//
// `test` corre las reglas de negocio y los guardarraíles de arquitectura: no
// toca Docker y tarda segundos. Es la que se usa mientras se escribe código.
//
// `integrationTest` corre lo que necesita base de datos. La imagen de SQL Server
// pesa más de 2 GB, así que se la aparta para que el ciclo iterativo no la
// pague. No cuelga de `check` por la misma razón: se invoca explícitamente,
// en CI y antes de cerrar una tarea.
def paqueteDeIntegracion = 'com.ferrovias.sismedico.integracion.*'

tasks.named('test') {
	useJUnitPlatform()
	filter {
		excludeTestsMatching paqueteDeIntegracion
		setFailOnNoMatchingTests(false)
	}
}

tasks.register('integrationTest', Test) {
	group = 'verification'
	description = 'Corre los tests que necesitan SQL Server sobre Testcontainers.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching paqueteDeIntegracion
		setFailOnNoMatchingTests(false)
	}
	shouldRunAfter tasks.named('test')
}

